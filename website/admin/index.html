<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#181C2E">
  <meta name="robots" content="noindex, nofollow">
  <title>U Angel Admin</title>
  <link rel="icon" type="image/png" href="../assets/icon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/catalog.css">
  <link rel="stylesheet" href="css/categories.css">
  <link rel="stylesheet" href="css/insights.css">
  <link rel="stylesheet" href="css/manage.css">
</head>
<body>
  <!-- Boot (shown until the session check finishes) -->
  <div id="boot" class="boot" role="status" aria-live="polite">
    <div style="display:grid;justify-items:center;gap:12px">
      <div class="spinner" aria-hidden="true"></div>
      <span>Loading admin…</span>
    </div>
  </div>

  <!-- Login -->
  <div id="login" class="login" hidden>
    <aside class="login-brand">
      <img class="login-logo" src="../assets/uangel-logo-white.png" alt="U Angel Foods">
      <div>
        <h1>Run the kitchen from one place.</h1>
        <p>Orders, catering &amp; event requests, the menu and customers — all in the U Angel Foods admin.</p>
      </div>
      <div class="foot">Admins only. Sign in with your U Angel Foods account.</div>
    </aside>
    <main class="login-main">
      <div class="login-wrap">
        <div class="login-mobile-logo"><img src="../assets/uangel-logo-white.png" alt="U Angel Foods"></div>
        <div class="login-card">
          <h2 id="login-title">Admin sign in</h2>
          <p class="sub">Welcome back. Please sign in to continue.</p>
          <form id="login-form" novalidate aria-labelledby="login-title">
            <div id="login-alert" class="alert alert-error" role="alert" hidden></div>
            <div class="field">
              <label for="login-email">Email</label>
              <input id="login-email" class="input" type="email" name="email" autocomplete="username" required placeholder="you@example.com">
            </div>
            <div class="field">
              <label for="login-password">Password</label>
              <div class="pw-wrap">
                <input id="login-password" class="input" type="password" name="password" autocomplete="current-password" required placeholder="Your password">
                <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password" aria-pressed="false">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
            <div class="login-row">
              <button type="button" class="link-btn" id="forgot-btn">Forgot password?</button>
            </div>
            <button type="submit" class="btn btn-primary" id="login-submit">Sign in</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <!-- App shell -->
  <div id="app" class="shell" hidden>
    <header class="topbar">
      <button type="button" class="icon-btn" id="nav-open" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <span class="brand-chip"><img src="../assets/uangel-logo-white.png" alt="U Angel Foods"></span>
      <span class="title" id="topbar-title"></span>
      <span class="nav-badge total-badge" id="topbar-badge" hidden></span>
    </header>

    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="sidebar-brand">
        <img src="../assets/uangel-logo-white.png" alt="U Angel Foods">
        <span class="tag">ADMIN</span>
        <button type="button" class="icon-btn nav-close" id="nav-close" aria-label="Close menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <div class="sidebar-user">
        <div class="avatar" id="user-avatar" aria-hidden="true">A</div>
        <div class="who">
          <strong id="user-name">Admin</strong>
          <span id="user-email"></span>
        </div>
        <button type="button" class="icon-btn" id="sign-out" aria-label="Sign out" title="Sign out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <main class="main" id="main">
      <div class="content" id="content" tabindex="-1"></div>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/core.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/requests.js"></script>
  <script src="js/products.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/promotions.js"></script>
  <script src="js/customers.js"></script>
</body>
</html>
